<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waleed Final Test Batch</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111}.w{max-width:620px;margin:auto;padding:12px}header{background:#111827;color:#fff;padding:16px;border-radius:0 0 14px 14px;position:sticky;top:0;z-index:3}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#d1d5db;margin-top:4px}.card{background:#fff;margin:12px 0;padding:15px;border-radius:14px;box-shadow:0 2px 8px #0001}.rank{font-size:12px;font-weight:bold;color:#166534}.match{float:right;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:999px}.meta{font-size:12px;color:#666}.portal{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold;margin:6px 0}.why,.ats,.changes{font-size:12px;padding:9px;border-radius:9px;margin:7px 0}.why{background:#f0fdf4;color:#166534}.ats{background:#fff7ed;color:#9a3412}.changes{background:#f5f3ff;color:#5b21b6}.btn{display:block;text-align:center;text-decoration:none;padding:13px;margin:8px 0;border-radius:10px;font-weight:bold;border:0;width:100%;box-sizing:border-box;font-size:15px}.cv{background:#16a34a;color:#fff}.apply{background:#2563eb;color:#fff}.toggle{background:#eef2ff;color:#3730a3}.qa{display:none;background:#f8fafc;padding:10px;border-radius:9px;font-size:12px}.q{margin:10px 0;padding-bottom:8px;border-bottom:1px solid #ddd}.copy{float:right;border:0;background:#e0e7ff;color:#3730a3;padding:6px 9px;border-radius:7px;font-weight:bold}.row{display:flex;gap:7px}.row button{flex:1;padding:10px;border:0;border-radius:9px;font-weight:bold}.done{background:#dcfce7}.help{background:#fee2e2}.note{font-size:12px;background:#ecfeff;color:#155e75;padding:10px;border-radius:10px;margin:12px 0}</style></head><body><div class="w"><header><h1>FINAL WORKFLOW TEST</h1><div class="sub">3 verified PHP/Laravel targets · different ATS CV for each role · direct CV download</div></header><div class="note"><b>Tomorrow workflow:</b> DOWNLOAD CV → APPLY NOW → use only answers actually asked → DONE / NEED HELP. The CV button should download the PDF rather than open a Drive preview.</div><div id="cards"></div></div><script>const jobs=[{n:1,company:'Airalo',title:'Backend / PHP Engineer',portal:'Lever',match:96,loc:'Remote UK',cv:'https://drive.google.com/uc?export=download&id=1BIDbBtoA2njgWCmeD_X6Uv2I5fdtM48I',apply:'https://jobs.lever.co/airalo/39338d13-5f26-4c0b-86af-f829b6bf8ef2',why:'High-value backend role with PHP/Laravel, APIs, SQL, Docker, CI/CD, AWS and scalable SaaS overlap.',ats:'PHP, Laravel, RESTful APIs, OOP, clean code, SQL, query optimisation, Docker, CI/CD, AWS, caching, microservices',changes:'CV changed to Backend / PHP Engineer. Skills now prioritise Backend Engineering, Data & APIs, Cloud & Delivery, Software Engineering, then AI/Full-Stack.',qa:[['Large-scale systems experience','I have 8+ years of experience building scalable SaaS and web platforms. At Histone Solutions I helped develop an analytics platform serving 10,000+ Amazon sellers using Laravel, PHP, MySQL, AWS and Docker, and previously worked on an ad platform serving 25,000+ websites. My work includes REST API optimisation, data-intensive workflows, cloud deployment and performance improvements.'],['Laravel experience','Approximately 7–8 years of hands-on commercial Laravel experience across SaaS platforms, REST APIs, integrations, authentication, database-driven systems and cloud-deployed applications.'],['Recent PHP versions','PHP 8.x in recent production development; I can confirm the exact minor versions used in the specific project if required.']]},{n:2,company:'Trybe',title:'Senior Laravel Developer',portal:'Workable',match:95,loc:'London hybrid · office attendance required',cv:'https://drive.google.com/uc?export=download&id=16kuybeQDrfFvnfX2vSfZvJhQ3516Ajs3',apply:'https://apply.workable.com/trybe-2/j/C0887DA33E/',why:'Excellent Laravel/PHP fit, but lower priority if London office attendance is not practical.',ats:'Laravel, PHP, performant RESTful APIs, large-scale data, MySQL, MongoDB, caching, backend refactoring, Docker, AWS',changes:'CV changed to Senior Laravel Developer. Skills now prioritise Laravel Backend, Data & Scale, Architecture, Cloud & Delivery, then Full-Stack Support.',qa:[['Why are you a strong Laravel candidate?','I bring approximately 7–8 years of hands-on commercial Laravel experience across scalable SaaS platforms, REST APIs, integrations and database-driven systems. I have delivered systems serving 10,000+ Amazon sellers and 25,000+ websites, with strong experience in PHP, MySQL, AWS, Docker and performance optimisation.'],['Large datasets','I have worked on data-intensive analytics and advertising platforms at significant scale, including an Amazon seller analytics platform serving 10,000+ sellers and an advertising platform supporting 25,000+ websites.']]},{n:3,company:'Rightangled',title:'Senior Backend Engineer (Laravel)',portal:'Workable',match:97,loc:'UK / check advert work pattern',cv:'https://drive.google.com/uc?export=download&id=1QlcIhcUer_jIMjqxWVF9si5NzkovmWnn',apply:'https://apply.workable.com/rightangled/j/360D70333D/',why:'Strongest combined Laravel + healthcare + AWS + AI/LLM opportunity.',ats:'Laravel, PHP, backend architecture, REST APIs, MySQL, AWS, Docker, CI/CD, microservices, healthcare SaaS, OpenAI/LLM integration',changes:'CV changed to Senior Backend Engineer (Laravel). Skills now prioritise Backend & Architecture, Data & Performance, Cloud & DevOps, Healthcare & AI, then Engineering Practices.',qa:[['Healthcare experience','I worked on a cloud-based healthcare SaaS platform using Laravel, Angular, TypeScript and REST APIs, including real-time video consultation functionality, Stripe integration and cloud deployment.'],['AI/LLM experience','My MSc project was an AI-driven HR automation platform built with Laravel, Angular, Python/Flask microservices and AI integrations for CV parsing, interview assessment and decision support.'],['Backend architecture experience','I have 8+ years of experience designing and delivering production web systems with Laravel/PHP, REST APIs, microservices, databases and AWS/Docker-based cloud delivery.']]}];function cp(t,b){let old=b.textContent;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>{b.textContent='COPIED';setTimeout(()=>b.textContent=old,1000)}).catch(()=>fallback(t,b,old))}else fallback(t,b,old)}function fallback(t,b,old){const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(x);b.textContent=ok?'COPIED':'SELECT';if(!ok)prompt('Copy this answer:',t);setTimeout(()=>b.textContent=old,1000)}function toggle(id){const x=document.getElementById(id);x.style.display=x.style.display==='block'?'none':'block'}function status(n,s){localStorage.setItem('finaltest'+n,s);render()}function render(){const c=document.getElementById('cards');c.innerHTML='';jobs.forEach(j=>{const st=localStorage.getItem('finaltest'+j.n)||'PENDING';const d=document.createElement('div');d.className='card';d.innerHTML=`<span class="rank">#${j.n} · ${st}</span><span class="match">${j.match}% fit</span><h2>${j.title}</h2><b>${j.company}</b><div class="meta">${j.loc}</div><span class="portal">Portal: ${j.portal}</span><div class="why"><b>Why apply:</b> ${j.why}</div><div class="ats"><b>ATS focus:</b> ${j.ats}</div><div class="changes"><b>What changed in this CV:</b> ${j.changes}</div><a class="btn cv" href="${j.cv}" target="_blank" rel="noopener">DOWNLOAD TAILORED CV</a><a class="btn apply" href="${j.apply}" target="_blank" rel="noopener">APPLY NOW · ${j.portal}</a><button class="btn toggle" onclick="toggle('qa${j.n}')">APPLICATION ANSWERS</button><div id="qa${j.n}" class="qa">${j.qa.map(x=>`<div class="q"><b>${x[0]}</b><button class="copy" data-copy="${x[1].replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="cp(this.dataset.copy,this)">COPY</button><div>${x[1]}</div></div>`).join('')}</div><div class="row"><button class="done" onclick="status(${j.n},'DONE')">DONE</button><button class="help" onclick="status(${j.n},'NEED HELP')">NEED HELP</button></div>`;c.appendChild(d)})}render();</script></body></html>
