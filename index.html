<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waleed Test Batch</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111}.w{max-width:600px;margin:auto;padding:12px}header{background:#111827;color:white;padding:16px;border-radius:0 0 14px 14px;position:sticky;top:0;z-index:3}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#d1d5db;margin-top:4px}.card{background:white;margin:12px 0;padding:15px;border-radius:14px;box-shadow:0 2px 8px #0001}.rank{font-size:12px;font-weight:bold;color:#166534}.match{float:right;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:999px}.meta{font-size:12px;color:#666}.portal{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold;margin:6px 0}.why,.ats{font-size:12px;padding:9px;border-radius:9px;margin:7px 0}.why{background:#f0fdf4;color:#166534}.ats{background:#fff7ed;color:#9a3412}.btn{display:block;text-align:center;text-decoration:none;padding:13px;margin:8px 0;border-radius:10px;font-weight:bold}.cv{background:#16a34a;color:white}.apply{background:#2563eb;color:white}.toggle{background:#eef2ff;color:#3730a3;border:0;width:100%}.qa{display:none;background:#f8fafc;padding:10px;border-radius:9px;font-size:12px}.q{margin:10px 0}.copy{float:right;border:0;background:#e0e7ff;color:#3730a3;padding:5px 8px;border-radius:7px}.row{display:flex;gap:7px}.row button{flex:1;padding:10px;border:0;border-radius:9px;font-weight:bold}.done{background:#dcfce7}.help{background:#fee2e2}.note{font-size:12px;background:#ecfeff;color:#155e75;padding:10px;border-radius:10px;margin:12px 0}</style></head><body><div class="w"><header><h1>NEW RULES - TEST BATCH</h1><div class="sub">3 high-fit PHP/Laravel applications - tailored master-format CV for every job</div></header><div class="note"><b>Test flow:</b> GET TAILORED CV -> APPLY NOW -> use prepared answers if asked -> mark DONE / NEED HELP.</div><div id="cards"></div></div><script>const jobs=[{n:1,company:'Trybe',title:'Senior Laravel Developer',portal:'Workable / Employer',match:96,loc:'Remote / UK-compatible',cv:'https://drive.google.com/file/d/1SQIyXqIrinw_vtzvpIweWIcx5z2esN-t/view?usp=drivesdk',apply:'https://apply.workable.com/trybe-2/j/C0887DA33E/',why:'Exceptional Laravel/PHP alignment: 8+ years, REST APIs, large-scale data, MySQL, AWS/Docker and production SaaS evidence.',ats:'Laravel, PHP, performant RESTful APIs, large-scale data, MySQL, AWS, Docker, CI/CD, scalable backend systems',qa:[['Briefly describe your large-scale systems experience','I have 8+ years of experience building scalable SaaS and web platforms. At Histone Solutions I helped develop an analytics platform serving 10,000+ Amazon sellers using Laravel, PHP, MySQL, AWS and Docker, and previously worked on an ad platform serving 25,000+ websites. My work includes REST API optimisation, data-intensive workflows, cloud deployment and performance improvements.'],['How much Laravel experience do you have?','Approximately 7-8 years of hands-on commercial Laravel experience across SaaS platforms, REST APIs, integrations, authentication, database-driven systems and cloud-deployed applications.']]},{n:2,company:'Reassured',title:'Senior PHP Developer',portal:'UK Laravel Jobs / Employer route',match:92,loc:'Basingstoke - Hybrid',cv:'https://drive.google.com/file/d/1UyBunHulzrRrDvQ7y4_kiypn8tJScewJ/view?usp=drivesdk',apply:'https://www.uklaraveljobs.com/',why:'Strong senior PHP/Laravel fit with architecture, API, MySQL/MongoDB, Docker, Git/Scrum and mentoring/ownership positioning.',ats:'PHP, Laravel, REST APIs, MySQL, MongoDB, Docker, Git, Scrum, architecture, code review, mentoring, production support',qa:[['Why are you suitable for a Senior PHP role?','I bring 8+ years of commercial full-stack/backend experience with deep PHP/Laravel expertise, scalable REST APIs, MySQL, cloud delivery and production systems. I have led a five-developer team, contributed to architecture decisions and code reviews, and delivered systems serving 10,000+ sellers and 25,000+ websites.']]},{n:3,company:'Lyles Sutherland',title:'PHP Web Application Developer',portal:'Indeed / Employer listing',match:91,loc:'Edinburgh - Hybrid',cv:'https://drive.google.com/file/d/1Rxr5W8VdF8vdZdlegr7BXtDJ8CwJvMQf/view?usp=drivesdk',apply:'https://uk.indeed.com/jobs?q=PHP+Web+Application+Developer+Lyles+Sutherland&l=Edinburgh',why:'Very strong PHP/MySQL fit and genuine Symfony experience is directly relevant.',ats:'PHP, MySQL, Laravel, Symfony, OOP, Git, REST APIs, third-party integrations, testing, refactoring',qa:[['Summarise your PHP experience','I have 8+ years of commercial web-development experience, including extensive PHP/Laravel work and around 3 years of Symfony exposure. I have built REST APIs, integrations, SaaS platforms and database-driven applications using PHP, MySQL and related backend technologies.']]}];function cp(t,b){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>b.textContent='COPIED').catch(()=>prompt('Copy this answer:',t))}else{prompt('Copy this answer:',t)}}function toggle(id){let x=document.getElementById(id);x.style.display=x.style.display==='block'?'none':'block'}function status(n,s){localStorage.setItem('testjob'+n,s);render()}function render(){let c=document.getElementById('cards');c.innerHTML='';jobs.forEach(j=>{let st=localStorage.getItem('testjob'+j.n)||'PENDING';let d=document.createElement('div');d.className='card';d.innerHTML=`<span class="rank">#${j.n} - ${st}</span><span class="match">${j.match}% fit</span><h2>${j.title}</h2><b>${j.company}</b><div class="meta">${j.loc}</div><span class="portal">Portal: ${j.portal}</span><div class="why"><b>Why apply:</b> ${j.why}</div><div class="ats"><b>ATS focus:</b> ${j.ats}</div><a class="btn cv" href="${j.cv}" target="_blank">GET TAILORED CV</a><a class="btn apply" href="${j.apply}" target="_blank">APPLY NOW</a><button class="btn toggle" onclick="toggle('qa${j.n}')">APPLICATION ANSWERS</button><div id="qa${j.n}" class="qa">${j.qa.map(x=>`<div class="q"><b>${x[0]}</b><button class="copy" onclick='cp(${JSON.stringify(x[1])},this)'>COPY</button><div>${x[1]}</div></div>`).join('')}</div><div class="row"><button class="done" onclick="status(${j.n},'DONE')">DONE</button><button class="help" onclick="status(${j.n},'NEED HELP')">NEED HELP</button></div>`;c.appendChild(d)})}render();</script></body></html>
