<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Waleed Jobs</title><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#111827}.wrap{max-width:520px;margin:auto;padding:14px}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:16px;border-radius:0 0 16px 16px;margin:-14px -14px 14px}header h1{margin:0 0 6px;font-size:21px}.sub{font-size:12px;color:#d1d5db}.bar{height:10px;background:#374151;border-radius:999px;overflow:hidden;margin:10px 0 5px}.fill{height:100%;width:0;background:#22c55e}.count{font-size:13px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}.card.complete{opacity:.6}.card.help{outline:2px solid #fecaca}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:12px;font-weight:bold;color:#6b7280}.match{font-size:12px;font-weight:bold;background:#dcfce7;color:#166534;padding:5px 9px;border-radius:999px}h2{font-size:19px;margin:8px 0 3px}.company{font-weight:bold}.meta{font-size:13px;color:#6b7280;margin:3px 0 12px}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin:9px 0;text-align:center;text-decoration:none;font-size:17px;font-weight:bold}.cv{background:#16a34a;color:#fff}.apply{background:#2563eb;color:#fff}.answers{background:#eef2ff;color:#3730a3}.answerbox{display:none;background:#f9fafb;border-radius:11px;padding:10px;font-size:13px;line-height:1.5}.q{padding:7px 0;border-bottom:1px solid #e5e7eb}.q:last-child{border-bottom:0}.ok{font-weight:bold;color:#166534}.warn{font-weight:bold;color:#991b1b}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:bold}.done{background:#dcfce7;color:#166534}.helpbtn{background:#fee2e2;color:#991b1b}.reset{background:#e5e7eb;color:#374151}.state,.cvstate{font-size:12px;color:#64748b;margin-top:6px}.notice{font-size:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin-bottom:14px;line-height:1.4}</style></head><body><div class="wrap"><header><h1>Today's Applications</h1><div class="sub">Tap GET CV → APPLY NOW → upload the newest CV from Recent/Downloads → DONE.</div><div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count">0 / 3 completed</div></header><div class="notice"><b>Live test:</b> these are real UK vacancies found this week. If a portal asks something not covered below, use NEED HELP instead of guessing.</div><div id="cards"></div></div><script>

{id:1,match:'90%',title:'PHP Developer',company:'Focus Group',meta:'Shoreham-by-Sea · Hybrid · 1 office day/week · Up to £50,000',apply:'https://uk.indeed.com/PHP-Laravel-Remote-jobs',cvtitle:'Senior PHP / Laravel Developer | APIs | Business-Critical Systems',summary:'Senior PHP/Laravel developer with 8+ years of experience building and supporting business-critical applications, APIs and data platforms. Strong hands-on background in MySQL/MariaDB, Vue.js, JavaScript, Bootstrap, Git workflows and production issue resolution, with additional AWS, CI/CD and AI integration capability.',skills:'PHP, Laravel, REST APIs, Vue.js, JavaScript, jQuery, MySQL, MariaDB, Bootstrap, Git, Postman, Docker, AWS, CI/CD, secure coding, production support',answers:[['PHP/Laravel experience?','8+ years'],['MySQL / MariaDB?','Yes'],['Vue.js / JavaScript / jQuery?','Yes'],['REST API development?','Yes — extensive'],['Can attend Shoreham office weekly?','HELP — confirm before answering'],['Billing/telecoms platform ownership?','Do not claim unless specifically asked and confirmed']]},
{id:2,match:'88%',title:'Symfony (PHP) Developer',company:'M10c',meta:'London SE1 · Hybrid · £45,000–£65,000',apply:'https://uk.indeed.com/q-php-symfony-remote-jobs.html',cvtitle:'Senior PHP / Symfony Developer | Backend APIs | Cloud Delivery',summary:'Senior PHP developer with 8+ years of experience building performant backend APIs and production web applications across Laravel and Symfony ecosystems. Strong in REST design, database/query optimisation, refactoring, Git-based code review and cloud delivery with Docker, AWS and Kubernetes.',skills:'Modern PHP, Symfony, Laravel, REST API design, OOP, SOLID, MySQL, MariaDB, PostgreSQL, Docker, AWS, Kubernetes, Linux/Nginx, Git/GitHub, CI/CD, refactoring, code review',answers:[['Modern PHP / Symfony?','Yes — PHP 8+ background and ~3 years Symfony'],['Backend REST APIs?','Yes — extensive'],['Docker / AWS / Kubernetes?','Yes'],['Database/query optimisation?','Yes'],['Doctrine / API Platform / Terraform?','HELP — do not claim unless confirmed'],['Can attend London hybrid days?','HELP — confirm before answering']]},

];

function render(){document.getElementById('cards').innerHTML=jobs.map(j=>`<section class="card" id="job${j.id}"><div class="top"><span class="tag">JOB 0${j.id}</span><span class="match">${j.match} match</span></div><h2>${j.title}</h2><div class="company">${j.company}</div><div class="meta">${j.meta}</div><button class="btn cv" onclick="makeCV(${j.id})">1. GET CV 0${j.id}</button><div class="cvstate" id="cv${j.id}">CV not downloaded yet.</div><a class="btn apply" href="${j.apply}" target="_blank">2. APPLY NOW</a><button class="btn answers" onclick="toggle(${j.id})">3. JOB-SPECIFIC ANSWERS</button><div class="answerbox" id="ans${j.id}">${j.answers.map(a=>`<div class="q">${a[0]} <span class="${a[1].startsWith('HELP')||a[1].startsWith('Do not')?'warn':'ok'}">${a[1]}</span></div>`).join('')}</div><div class="row"><button class="done" onclick="setStatus(${j.id},'DONE')">DONE</button><button class="helpbtn" onclick="setStatus(${j.id},'HELP')">NEED HELP</button><button class="reset" onclick="setStatus(${j.id},'')">RESET</button></div><div class="state">Status: <b id="s${j.id}">NOT DONE</b></div></section>`).join('');jobs.forEach(j=>paint(j.id));progress()}
function toggle(id){const e=document.getElementById('ans'+id);e.style.display=e.style.display==='block'?'none':'block'}
function setStatus(id,v){localStorage.setItem('finaljob'+id,v);paint(id);progress()}
function paint(id){const v=localStorage.getItem('finaljob'+id)||'';const c=document.getElementById('job'+id);const s=document.getElementById('s'+id);c.classList.remove('complete','help');if(v==='DONE'){c.classList.add('complete');s.textContent='✅ DONE'}else if(v==='HELP'){c.classList.add('help');s.textContent='⚠️ NEED HELP'}else s.textContent='NOT DONE'}
function progress(){let d=0,h=0;jobs.forEach(j=>{const v=localStorage.getItem('finaljob'+j.id);if(v==='DONE')d++;if(v==='HELP')h++});document.getElementById('count').textContent=`${d} / ${jobs.length} completed${h?' · '+h+' need help':''}`;document.getElementById('fill').style.width=(d/jobs.length*100)+'%'}
function makeCV(id){if(!window.jspdf){alert('PDF tool is loading. Try again in a second.');return}const j=jobs.find(x=>x.id===id);const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});let y=15;function add(t,s=9,b=false,gap=2){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(s);const w=d.splitTextToSize(t,178);if(y+w.length*4.2>282){d.addPage();y=18}d.text(w,16,y);y+=w.length*4.2+gap}add('Waleed Mazhar',18,true,1);add(j.cvtitle,11,true,2);add('Glasgow, United Kingdom | +44 7404 536622 | waleed.mazhar02@gmail.com',8.5,false,1);add('linkedin.com/in/waleed-mazhar | github.com/waleedmazhar64',8.5,false,4);add('PROFESSIONAL SUMMARY',11,true,2);add(j.summary,9,false,4);add('CORE SKILLS',11,true,2);add(j.skills,9,false,4);add('PROFESSIONAL EXPERIENCE',11,true,2);baseExperience.forEach(e=>{add(e[0],9,true,1);e[1].forEach(b=>add('• '+b,8.7,false,1));y+=2});add('AI ENGINEERING & UK EXPERIENCE',11,true,2);add('AI-Powered HR Automation Platform | MSc Applied Project | Glasgow | 2024 - 2025',9,true,1);add('Designed a Laravel, Angular and Python/Flask microservices platform for CV parsing, interview assessment, onboarding, scheduling and leave-management workflows, with AI decision support and audit logging.',8.7,false,2);add('Additional UK Experience: Assistant Manager, Blue Lagoon Fish & Chips, Glasgow | Sep 2024 - Present.',8.7,false,4);add('EDUCATION',11,true,2);add('MSc Artificial Intelligence | University of the West of Scotland, UK | 2024 - 2025',8.8,false,1);add('BSc Software Engineering | University of Engineering & Technology, Pakistan | 2012 - 2016',8.8,false,1);d.save(`CV 0${id}.pdf`);document.getElementById('cv'+id).textContent=`CV 0${id}.pdf generated — choose it from Recent/Downloads.`}
window.addEventListener('DOMContentLoaded',render);
</script></body></html>
